# ===========================================================================
# Conda environment for AlphaFlow.
#
# IMPORTANT for RTX 50-series / Blackwell GPUs (e.g. RTX 5090, sm_120):
#   You need CUDA >= 12.8 kernels.  The original `pytorch=2.6.0` + cu118
#   nightly combination does NOT support sm_120.  Use the updated pins below,
#   or (preferred on a single GPU / plain server account) use the venv setup:
#
#       bash scripts/setup_env.sh
#
#   See docs/SINGLE_GPU.md for details.
# ===========================================================================
name: alphaflow
channels:
  - pytorch
  - nvidia
dependencies:
  - python=3.11
  - pip
  - pillow
  - pytorch=2.7.1
  - torchvision=0.22.1
  - pytorch-cuda=12.8
  - requests
  - pip:
    # NOTE: torch / torchvision are installed by conda above (cu128).
    # Do NOT add nightly cu118 torch wheels here -- they overwrite the
    # Blackwell-capable build.
    - tqdm
    - gitpython
    - gpustat
    - hydra-core==1.3
    - scipy==1.10 # For 1.13, FID128 will be computed incorrectly since scipy.linalg.sqrtm will fail for degenerate matrices.
    - einops
    - av
    - ftfy
    - regex
    - protobuf
    - joblib==1.2.0
    - wandb==0.16.6
    - termcolor
    - matplotlib
    - click
    - torchmetrics==1.3.2
    - lpips==0.1.4
    - timm==1.0.11
    - git+https://github.com/openai/CLIP.git
    - git+https://github.com/universome/streaming@bf7fca61e3f0c023fb0b3b77187ef017be7f18f0
    - beartype
    - loguru
    - torch_dct
    - fvcore # To print FLOPs in model summary

    # For diffusers we use our own version with use_reentrant=False in CogVideoX.
    # On a single GPU the plain release is enough, so if the git install fails:
    #   - diffusers==0.32.2
    - git+https://github.com/universome/diffusers@97715f0dd680594dd6812323df207ad23d8384d6

    - git+https://github.com/universome/Cosmos-Tokenizer@ed0cb8542111d3c34c071edc46a5da3339a475dd

    # To run some infrastructure scripts
    - awscli

    # Installing accelerate for the only purpose of diffusers not to through warnings...
    - accelerate
